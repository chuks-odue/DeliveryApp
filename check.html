<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment</title>
   <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="shortcut icon" href="img/food-delivery-high-resolution-logo-transparent.png" type="image/x-icon">

  <link rel="stylesheet" href="payment.css">
</head>
<body>
     <header id="myHeader">
      <nav>
      <div class="container">
        <div class="logo"><img src="img/food-delivery-high-resolution-logo-transparent.png" alt=""></div>
        <button class="cart-btn">
          <a href="index.html">HOME</a> 
        </button>    
        
         
      </div>
      
    </nav>
      </header>
    
<div class="payment-container">
  <h2>Payment Details</h2>
  <p>Total Amount: $<span id="total-amount"></span></p>
  <form id="payment-form">
    <label for="payment-method">Select Payment Method:</label>
    <select id="payment-method" name="payment-method">
      <option value="">Select Payment Method</option>
      <option value="credit-card">Credit Card</option>
      <option value="paypal">PayPal</option>
      <option value="bank-transfer">Bank Transfer</option>
    </select>
    <button id="continue-button" type="button" style="display: none;">Continue</button>
    <div id="credit-card-details" style="display: none;">
      <label for="card-number">Card Number:</label>
      <input type="text" id="card-number" name="card-number">
      <label for="expiry-date">Expiry Date:</label>
      <input type="text" id="expiry-date" name="expiry-date">
      <label for="cvv">CVV:</label>
      <input type="text" id="cvv" name="cvv">
    </div>
    <div id="paypal-details" style="display: none;">
      <label for="paypal-email">PayPal Email:</label>
      <input type="email" id="paypal-email" name="paypal-email">
    </div>
    <div id="bank-transfer-details" style="display: none;">
      <label for="bank-name">Bank Name:</label>
      <input type="text" id="bank-name" name="bank-name">
      <label for="account-number">Account Number:</label>
      <input type="text" id="account-number" name="account-number">
      <label for="routing-number">Routing Number:</label>
      <input type="text" id="routing-number" name="routing-number">
    </div>
    <div class="payment-buttons">
     <button id="go-back-button" type="button" style="display: none;">Go Back</button>
    <button id="pay-button" style="display: none;">Pay Now</button>

    </div>

  </form>
</div>
    <footer>
      <div class="footnote">
  
          <img  id = "footer-lieferando" src="img/food-delivery-high-resolution-logo-transparent.png"  alt = "sakura_ramen_logo_and_text"><br>
          <div id="footersocial">
            <a href = "https://www.facebook.com/chuks.hart" ><img src="img/facebook_logo.png"></a >
           <a href = "#" > <img src="img/instagrram_logo.png" ></a >
          </div>  
      
                    
                          
      </div>
      
    </footer>


  <script src="payment.js"></script>
</body>
</html>
